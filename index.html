<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FitPulse Pro - Personal Fitness Management System</title>
    <meta name="description" content="Complete personal fitness, workout, diet, health calculator, coach planning, and body analytics system." />
    <meta property="og:title" content="FitPulse Pro - Personal Fitness Management System" />
    <meta property="og:description" content="Complete personal fitness, workout, diet, health calculator, coach planning, and body analytics system." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-slate-950">
    <div id="root">
      <!-- Instant Pre-render Fallback: Eliminates initial black screen while scripts load -->
      <div id="pre-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; text-align: center;">
        <div style="position: relative; width: 64px; height: 64px; margin-bottom: 24px;">
          <div style="position: absolute; inset: 0; border: 3px solid rgba(16, 185, 129, 0.15); border-top-color: #10b981; border-radius: 50%; animation: fitpulse-spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;"></div>
          <div style="position: absolute; inset: 8px; border: 3px solid rgba(20, 184, 166, 0.15); border-bottom-color: #14b8a6; border-radius: 50%; animation: fitpulse-spin 1.4s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite reverse;"></div>
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px;">⚡</div>
        </div>
        <h1 style="font-size: 22px; font-weight: 800; letter-spacing: -0.025em; margin: 0 0 8px 0; color: #ffffff;">FitPulse <span style="color: #10b981;">Pro</span></h1>
        <p style="font-size: 13px; color: #94a3b8; margin: 0 0 16px 0; font-weight: 500;">लोड होत आहे... (Loading Personal Fitness System)</p>
        <div style="width: 140px; height: 3px; background-color: #1e293b; border-radius: 999px; overflow: hidden;">
          <div style="width: 100%; height: 100%; background: linear-gradient(90deg, #10b981, #06b6d4); animation: fitpulse-pulse 1.8s ease-in-out infinite;"></div>
        </div>
        <noscript>
          <p style="margin-top: 20px; color: #f87171; font-size: 13px;">JavaScript is required to run FitPulse Pro. Please enable JavaScript in your browser.</p>
        </noscript>
      </div>
      <style>
        @keyframes fitpulse-spin { to { transform: rotate(360deg); } }
        @keyframes fitpulse-pulse { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
